<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Globe Simulation Core</title>

    <style>
        #osd-console {
            position: fixed; top: 0; left: 0; width: 100%; height: 35%;
            background: rgba(0,0,0,0.85); color: #0f0; font-family: monospace;
            font-size: 11px; z-index: 99999; overflow-y: auto; padding: 45px 10px 10px 10px;
            pointer-events: none; border-bottom: 2px solid #0f0; word-wrap: break-word;
            display: none;
        }
    </style>
    <script>
        window._osdQueue = [];
        function logToOSD(msg, color) { console.log(msg); }
        window.onerror = function(msg, url, line, col, error) {
            logToOSD('[Syntax/Global Error] ' + msg + ' at ' + line + ':' + col, '#f33');
            return false;
        };
        window.addEventListener('error', function(e) {
            if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
                logToOSD('[Load Error] Failed to load file: ' + e.target.src, '#f33');
            }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
            logToOSD('[Promise Error] ' + (e.reason ? e.reason.message : 'Unknown'), '#f33');
        });
        window.logToOSD = logToOSD;

        function updateUIBottomMargin() {
            const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
            const hasBottomBar = !isStandalone && (window.innerHeight < window.screen.height - 150); 
            
            // ★修正: ユーザーの意図した環境判定を活かしつつ、最適値を設定
            // ツールバーがない環境(GRAVITY等)は、ホームインジケータ+30pxのゆとり
            let margin = 'calc(env(safe-area-inset-bottom) + 30px)'; 
            if (hasBottomBar) {
                // ツールバーがある環境(Safari等)は、100dvhがツールバーを避けるため16pxの隙間で十分
                margin = '16px'; 
            }
            document.documentElement.style.setProperty('--ui-bottom', margin);
        }
        window.addEventListener('resize', updateUIBottomMargin);
        window.addEventListener('DOMContentLoaded', updateUIBottomMargin);
    </script>

    <script>
        window.APP_LANG = {
            toastNoRoute: "先に空路を開拓してください",
            toastLimit: "接続上限、または既に開拓済みです",
            errMapLoad: "地図データの取得に失敗しました。",
            hubMajor: "拠点ハブ",
            hubLocal: "地方空港",
            hubFictional: "中継基地",
            btnLimit: "接続上限です",
            btnConnect: "空路を開拓する"
        };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <style>
        :root {
            --ui-bottom: 30px;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden;
            background-color: #020617; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
            -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
        }
        #webgl-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; }
        .interactive-ui { pointer-events: auto; touch-action: manipulation; }
        
        .bottom-sheet { 
            transform: translateY(200px); 
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            bottom: var(--ui-bottom) !important;
            width: 90% !important;
            max-width: 400px !important;
        }
        .bottom-sheet.show { 
            transform: translateY(0); 
            opacity: 1;
            pointer-events: auto;
        }
        #connecting-mode-card {
            width: fit-content !important;
            min-width: 240px;
        }
        
        .toast-show { opacity: 1 !important; transform: translate(-50%, 0) !important; }
        #fab-buy-plane { bottom: var(--ui-bottom) !important; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="text-slate-100">

    <div id="webgl-container"></div>

    <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/90 backdrop-blur-sm transition-opacity duration-500">
        <div class="w-12 h-12 border-4 border-cyan-500/30 border-t-cyan-400 rounded-full animate-spin mb-4"></div>
        <h2 class="text-sm font-bold text-cyan-300 tracking-widest uppercase">システム起動中...</h2>
        <p class="text-xs text-slate-500 mt-2">高精度マップデータを読み込んでいます</p>
    </div>

    <div id="toast-notification" class="fixed top-24 left-1/2 transform -translate-x-1/2 -translate-y-4 px-5 py-2 bg-red-600/90 text-white text-sm font-bold rounded-full shadow-lg shadow-red-900/50 opacity-0 pointer-events-none transition-all duration-300 z-50">
        Message
    </div>

    <div id="ui-layer" class="pb-4 px-4 relative overflow-hidden flex flex-col items-center">
        
        <div id="connecting-mode-card" class="interactive-ui bottom-sheet bg-slate-900/95 border border-cyan-500/50 rounded-full py-2 px-5 backdrop-blur-md shadow-lg shadow-cyan-900/40 absolute flex items-center justify-between space-x-4">
            <p class="text-xs text-yellow-400 font-bold animate-pulse whitespace-nowrap">行先の空港をタップ...</p>
            <button id="btn-cancel-connect" class="px-4 py-2 rounded-full bg-slate-800 text-slate-300 text-xs font-bold active:bg-slate-700 whitespace-nowrap">キャンセル</button>
        </div>

        <div id="route-confirm-card" class="interactive-ui bottom-sheet bg-slate-900/95 border border-yellow-500/50 rounded-2xl p-4 backdrop-blur-md shadow-lg shadow-yellow-900/20 absolute">
            <h3 class="text-xs text-yellow-400 font-bold tracking-wider mb-2">空路開拓</h3>
            <div class="flex justify-between items-center text-lg font-bold mb-4">
                <span id="route-from" class="text-white">---</span>
                <span class="text-slate-500">➔</span>
                <span id="route-to" class="text-white">---</span>
            </div>
            <div class="flex space-x-3">
                <button id="btn-cancel-route" class="flex-1 py-3 rounded-xl bg-slate-800 text-slate-300 font-bold active:bg-slate-700">キャンセル</button>
                <button id="btn-open-route" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold active:bg-blue-500 shadow-lg shadow-blue-900/50">開拓する</button>
            </div>
        </div>

        <div id="airport-info-card" class="interactive-ui bottom-sheet bg-slate-900/95 border border-cyan-500/50 rounded-2xl p-4 backdrop-blur-md shadow-lg shadow-cyan-900/40 absolute">
            <div class="flex justify-between items-start mb-3">
                <div>
                    <h3 id="airport-name" class="text-xl font-bold text-white leading-tight">Name</h3>
                    <p id="airport-country" class="text-sm text-slate-400">Country</p>
                </div>
                <div class="bg-cyan-950 border border-cyan-500 text-cyan-300 px-2 py-1 rounded text-sm font-mono font-bold">
                    <span id="airport-code">XXX</span>
                </div>
            </div>
            <div class="flex items-center space-x-2 mb-4">
                <span id="airport-type" class="text-xs font-semibold text-cyan-400 uppercase tracking-wider">Type</span>
                <span class="text-slate-600">|</span>
                <span class="text-xs text-slate-400">接続数: <span id="airport-conn" class="text-white font-bold">0/0</span></span>
            </div>
            <button id="btn-connect" class="w-full py-3 rounded-xl bg-cyan-600 text-white font-bold active:bg-cyan-500 shadow-lg shadow-cyan-900/50 transition-colors">
                Connect
            </button>
        </div>

        <button id="fab-buy-plane" class="interactive-ui absolute right-6 w-16 h-16 bg-emerald-500 rounded-full shadow-xl shadow-emerald-900/50 flex items-center justify-center text-slate-900 active:scale-95 z-20 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
        </button>

        <div id="buy-plane-menu" class="interactive-ui bottom-sheet absolute bg-slate-900/95 border border-emerald-500/50 rounded-2xl p-5 backdrop-blur-md shadow-lg shadow-emerald-900/40 z-30">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-white">飛行機を購入</h2>
                <button id="btn-close-buy" class="text-slate-400 active:text-white p-1 text-xl font-bold">✕</button>
            </div>
            <div class="grid grid-cols-4 gap-2">
                <button class="buy-plane-btn flex flex-col items-center justify-between bg-slate-800 p-2 rounded-xl active:bg-slate-700 border border-transparent active:border-emerald-500 h-20 transition-colors" data-type="small">
                    <div class="flex-1 flex items-center justify-center">
                        <span class="text-emerald-400"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></span>
                    </div>
                    <span class="text-[10px] font-bold text-slate-200 tracking-wide mt-1">小型機</span>
                </button>
                <button class="buy-plane-btn flex flex-col items-center justify-between bg-slate-800 p-2 rounded-xl active:bg-slate-700 border border-transparent active:border-emerald-500 h-20 transition-colors" data-type="medium">
                    <div class="flex-1 flex items-center justify-center">
                        <span class="text-emerald-400"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></span>
                    </div>
                    <span class="text-[10px] font-bold text-slate-200 tracking-wide mt-1">中型機</span>
                </button>
                <button class="buy-plane-btn flex flex-col items-center justify-between bg-slate-800 p-2 rounded-xl active:bg-slate-700 border border-transparent active:border-emerald-500 h-20 transition-colors" data-type="large">
                    <div class="flex-1 flex items-center justify-center">
                        <span class="text-emerald-400"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></span>
                    </div>
                    <span class="text-[10px] font-bold text-slate-200 tracking-wide mt-1">大型機</span>
                </button>
                <button class="buy-plane-btn flex flex-col items-center justify-between bg-slate-800 p-2 rounded-xl active:bg-slate-700 border border-transparent active:border-emerald-500 h-20 transition-colors" data-type="super">
                    <div class="flex-1 flex items-center justify-center">
                        <span class="text-emerald-400"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></span>
                    </div>
                    <span class="text-[10px] font-bold text-slate-200 tracking-wide mt-1">超大型</span>
                </button>
            </div>
        </div>
    </div>

    <!-- キャッシュバスターはブラウザ機能に依存(動的importmapは禁止) -->
    <script type="module">
        var ts = new Date().getTime();
        import('./main.js?t=' + ts)
            .then(function(module) {
                if (document.readyState === 'complete') {
                    if (typeof window.onload === 'function') window.onload();
                }
            })
            .catch(function(err) {
                console.error("[FATAL] Dynamic Import Failed:", err);
            });
    </script>
</body>
</html>
