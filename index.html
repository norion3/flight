<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover と user-scalable=no により、ネイティブアプリの挙動を再現 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Globe Simulation Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            /* モダンな dvh を使用し、ブラウザのURLバー伸縮によるレイアウト崩れを完全に防ぐ */
            height: 100dvh; 
            overflow: hidden;
            background-color: #020617;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            
            /* --- スマホ特有のブラウザ挙動を完全にマスク（封印）する設定群 --- */
            touch-action: none; /* ブラウザ標準のパン・ズーム操作を無効化 */
            user-select: none; /* テキストの選択を無効化 */
            -webkit-user-select: none; /* iOS Safariのテキスト選択無効化 */
            -webkit-touch-callout: none; /* iOS Safariでの長押しによる画像保存等のメニューを無効化 */
            -webkit-tap-highlight-color: transparent; /* タップした際のグレーのハイライトを無効化 */
            overscroll-behavior: none; /* 画面端でのスワイプリロード(バウンス)を無効化 */
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-overlay {
            position: absolute;
            z-index: 10;
            pointer-events: none;
        }
        .pointer-events-auto {
            pointer-events: auto;
        }
    </style>
</head>
<body class="text-slate-100">

    <div id="webgl-container"></div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/90 backdrop-blur-sm transition-opacity duration-500">
        <div class="w-12 h-12 border-4 border-cyan-500/30 border-t-cyan-400 rounded-full animate-spin mb-4"></div>
        <h2 class="text-sm font-bold text-cyan-300 tracking-widest uppercase">Initializing Globe Core...</h2>
        <p class="text-xs text-slate-500 mt-2">Loading authentic high-resolution map data</p>
    </div>

    <!-- Airport Info Card (GRAVITYのセーフエリアを回避した下部配置) -->
    <div id="airport-info-card" class="ui-overlay bottom-12 left-1/2 transform -translate-x-1/2 translate-y-12 opacity-0 transition-all duration-300 w-80 pointer-events-auto">
        <div class="bg-slate-900/90 border border-cyan-500/50 rounded-xl p-4 backdrop-blur-md shadow-lg shadow-cyan-900/40">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <h3 id="airport-name" class="text-lg font-bold text-white leading-tight">Airport Name</h3>
                    <p id="airport-country" class="text-sm text-slate-400">Country</p>
                </div>
                <div class="bg-cyan-950 border border-cyan-500 text-cyan-300 px-2 py-1 rounded text-sm font-mono font-bold">
                    <span id="airport-code">XXX</span>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-cyan-500"></span>
                </span>
                <span id="airport-type" class="text-xs font-semibold text-cyan-400 uppercase tracking-wider">Major Hub</span>
            </div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
